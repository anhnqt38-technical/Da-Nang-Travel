<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Đà Nẵng</title>

    <link rel="stylesheet" href="../Css/Dangky.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wgh…;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="register-container">

    <div class="banner">
        <div class="banner-script">Khám phá</div>
        <h1>ĐÀ NẴNG</h1>
        <p>Tận hưởng vẻ đẹp thành phố biển<br>
        khám phá những điều tuyệt vời</p>
    </div>

    <div class="form-content">

        <div class="user-icon">
            <i class="fa-solid fa-user"></i>
        </div>

        <h2 class="form-title">Đăng ký tài khoản</h2>
        <p class="form-subtitle">
            Nhanh chóng · Dễ dàng · An toàn
        </p>

        <div class="success-message" id="success" role="status" aria-live="polite">
            <i class="fa-solid fa-circle-check"></i>
            Bạn đã đăng ký tài khoản thành công
        </div>

        <form id="registerForm">

            <div class="input-group">
                <label><i class="fa-solid fa-user"></i> Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên của bạn">
                <small class="error-message" id="fullnameError"></small>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="Nhập email của bạn">
                <small class="error-message" id="emailError"></small>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-phone"></i> Số điện thoại</label>
                <input type="tel" id="phone" placeholder="Nhập số điện thoại của bạn">
                <small class="error-message" id="phoneError"></small>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-lock"></i> Mật khẩu</label>
                <div class="password-box">
                    <input type="password" id="password" placeholder="Nhập mật khẩu">
                    <i class="fa-regular fa-eye toggle-password"
                       onclick="togglePassword('password', this)"></i>
                </div>
                <small class="error-message" id="passwordError"></small>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-lock"></i> Xác nhận mật khẩu</label>
                <div class="password-box">
<input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
                    <i class="fa-regular fa-eye toggle-password"
                       onclick="togglePassword('confirmPassword', this)"></i>
                </div>
                <small class="error-message" id="confirmPasswordError"></small>
            </div>

            <small class="error-message" id="storageError"></small>

            <button type="submit" class="register-btn">
                <i class="fa-solid fa-user-plus"></i>
                Đăng ký
            </button>

        </form>

        <div class="divider">Hoặc</div>

        <div class="social-login">
            <button type="button" class="social-btn" onclick="socialLogin('Google')">
                <i class="fa-brands fa-google google"></i>
                Đăng ký với Google
            </button>

            <button type="button" class="social-btn" onclick="socialLogin('Facebook')">
                <i class="fa-brands fa-facebook facebook"></i>
                Đăng ký với Facebook
            </button>
        </div>

        <div class="footer">
            Đã có tài khoản?
            <a href="Dangnhap.html">Đăng nhập ngay</a>
        </div>

    </div>
</div>

<script src="../JS/Dangky.js"></script>
</body>
</html>
