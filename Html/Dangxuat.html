<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng xuất - Đà Nẵng Travel</title>
    <link rel="stylesheet" href="../Css/Dangxuat.css">
</head>
<body>
    <main class="logout-card">
        <div class="logout-icon" aria-hidden="true">↗</div>
        <p class="eyebrow">ĐÀ NẴNG TRAVEL</p>
        <h1>Đăng xuất tài khoản?</h1>
        <p class="logout-description">
            Bạn có chắc chắn muốn đăng xuất khỏi tài khoản hiện tại không?
        </p>

        <p class="logout-message" id="logoutMessage" role="status" aria-live="polite"></p>

        <form id="logoutForm" class="logout-actions">
            <button type="submit" class="button button-primary">Đăng xuất</button>
            <a class="button button-secondary" href="index.html">Ở lại trang chủ</a>
        </form>
    </main>

    <script src="../JS/Dangxuat.js"></script>
</body>
</html>
